

name: Encar price alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Search Encar
        env:
          XAPI_KEY: ${{ secrets.XAPI_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json, requests
          from pathlib import Path

          headers = {"X-API-Key": os.environ["XAPI_KEY"]}
          params = {
              "source": "encar",
              "sale_type": "normal",
              "sort": "Price",
              "limit": 20,
              "lang": "en"
          }

          r = requests.get(
              "https://api.xapikorea.com/v1/search",
              headers=headers, params=params, timeout=30
          )
          r.raise_for_status()
          cars = r.json().get("results", [])

          path = Path("seen.json")
          seen = json.loads(path.read_text()) if path.exists() else []
          known = set(seen)
          added = []

          for car in cars:
              cid = str(car.get("id", ""))
              if not cid or cid in known:
                  continue

              price = car.get("price_krw")
              if not price:
                  continue

              name = " ".join(str(car.get(k, "")) for k in
                              ("manufacturer", "model", "badge"))
              year = car.get("year", "")
              mileage = car.get("mileage_km", 0)
              url = car.get("encar_url", "")

              msg = (
                  f"🚗 RIZK AUTO — ENCAR\n\n{name}\n"
                  f"Год: {year}\nПробег: {mileage:,} км\n"
                  f"Цена: ₩{price:,}\n\n{url}"
              )

              base = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/"
              photo = car.get("thumbnail")
              if photo:
                  result = requests.post(
                      base + "sendPhoto",
                      data={"chat_id": os.environ["CHAT_ID"],
                            "photo": photo, "caption": msg}, timeout=30
                  )
              else:
                  result = requests.post(
                      base + "sendMessage",
                      data={"chat_id": os.environ["CHAT_ID"],
                            "text": msg}, timeout=30
                  )
              result.raise_for_status()
              added.append(cid)

          path.write_text(json.dumps((seen + added)[-1000:]))
          print("Новых объявлений:", len(added))
          PY

      - name: Save seen listings
        run: |
          git config user.name "Rizk Auto Bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (
            git commit -m "Update seen listings"
            git push
          )

